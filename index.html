<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Scanner</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <img src="assets/LogoAICam.png" alt="AI Cam Logo" class="header-logo-static">
                <span class="logo-text">Scanner</span>
            </div>
            <div class="header-right">
                <span class="mode-badge" id="mode-badge">DEMO</span>
            </div>
        </header>

        <!-- CAMERA AREA -->
        <div class="camera-area">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>

            <div class="camera-overlay" id="camera-overlay">
                <div class="loading-spinner"></div>
                <p id="overlay-text">Memulai Sistem...</p>
            </div>

            <div class="detection-info" id="detection-info" style="display: none;">
                <h2 class="detected-class" id="detected-class">person</h2>
                <p class="detected-summary" id="detected-summary">Terdeteksi 1 objek • Confidence 82%</p>
                <div class="detected-tags" id="detected-tags"></div>
            </div>

            <!-- FLOATING BUTTONS (Tanpa tombol AI Scan) -->
            <div class="floating-buttons">
                <button class="fab fab-camera" id="btn-camera" title="Kamera">
                    <i class="fas fa-camera"></i>
                </button>
                
                <!-- Logo AI yang BISA DIKLIK untuk aktifkan AI -->
                <img src="assets/LogoAI.png" alt="AI Scan" class="logo-ai-clickable" id="logo-ai-btn" title="Klik untuk AI Scan">
                
                <button class="fab fab-switch" id="btn-switch" title="Ganti Kamera">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="fab fab-flash" id="btn-flash" title="Flash">
                    <i class="fas fa-bolt"></i>
                    <span class="fab-label">Flash</span>
                </button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-scanner" data-page="scanner">
                <i class="fas fa-home"></i>
                <span>Scanner</span>
            </button>
            <button class="nav-item" id="nav-log" data-page="log">
                <i class="fas fa-clipboard-list"></i>
                <span>Log Data</span>
                <span class="nav-badge hidden" id="log-badge">0</span>
            </button>
        </nav>

        <!-- LOG PAGE -->
        <div class="log-page" id="log-page" style="display: none;">
            <div class="log-header">
                <h2>Detected Objects Logs</h2>
                <span class="log-count" id="log-count-header">0 Items</span>
            </div>
            <div class="log-list" id="log-list">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>Belum ada objek terdeteksi</p>
                </div>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/@tensorflow/tfjs@3.20.0/dist/tf.min.js"></script>
    <script src="https://unpkg.com/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
